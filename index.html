    <!-- Structured data: SoftwareApplication (Buku Warung) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Buku Warung",
        "operatingSystem": "Android",
        "applicationCategory": "BusinessApplication",
        "offers": {
          "@type": "Offer",
          "price": "50000",
          "priceCurrency": "IDR",

          "description": "Lisensi resmi 1 email pemilik untuk 1 perangkat aktif selamanya tanpa langganan."
        }
      }
    </script>

    <!-- Structured data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Berapa harga aplikasi Buku Warung?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Harganya Rp50.000 sekali bayar untuk selamanya. Tidak ada biaya langganan bulanan, tahunan, maupun biaya tersembunyi lainnya."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah ada biaya langganan tambahan di kemudian hari?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tidak ada. Sekali Anda membeli lisensi resmi Buku Warung, aplikasi dapat terus Anda gunakan tanpa batas waktu."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah Buku Warung bisa digunakan tanpa internet (offline)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ya, 100% bisa offline. Koneksi internet hanya dibutuhkan satu kali saat aktivasi lisensi awal. Setelah sukses diaktifkan, kasir POS, cetak struk, dan pembukuan berjalan tanpa kuota internet."
            }
          },
          {
            "@type": "Question",
            "name": "Berapa perangkat yang bisa menggunakan 1 lisensi Buku Warung?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "1 Lisensi berlaku untuk 1 HP Android aktif dan terikat pada Email Pemilik (Owner Email) yang Anda daftarkan."
            }
          },
          {
            "@type": "Question",
            "name": "Bagaimana jika HP saya rusak, hilang, atau saya ingin ganti HP baru?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Lisensi Anda tidak hangus karena terdaftar atas nama email Anda. Anda cukup menghubungi admin SKMNetwork untuk memverifikasi email pemilik dan memindahkan aktivasi lisensi ke perangkat baru Anda."
            }
          }
        ]
      }
    </script>
